name: Request review for failing Dependabot checks

on:
  workflow_run:
    workflows: [Update Flake]
    types: [completed]
    branches: ["dependabot/nix/**"]

permissions: {}

jobs:
  request-review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    concurrency:
      group: dependabot-review-${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Request review on the current Dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEWER: josephst
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # A failure in the auto-merge job should not request review.
          failed_checks=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name | startswith("Flake checks ("))
              | select(.conclusion == "failure" or .conclusion == "timed_out") | .name')
          if [[ -z "$failed_checks" ]]; then
            exit 0
          fi

          # Look up the open PR again because Dependabot may have pushed a newer commit.
          pull_requests=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$HEAD_BRANCH")
          review_requests=$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg sha "$HEAD_SHA" \
            --arg reviewer "$REVIEWER" '
              .[] | select(.user.login == "dependabot[bot]" and .draft == false
                and .head.repo.full_name == $repo and .head.sha == $sha)
              | select(any(.requested_reviewers[]?; .login == $reviewer) | not)
              | .number
            ' <<< "$pull_requests")
          for pr in $review_requests; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$pr/requested_reviewers" \
              -f "reviewers[]=$REVIEWER" --silent
          done
